<h2>Lista de personajes de DBZ</h2>
@for (dbz of animes(); track dbz.id) { <!-- Track sirve para identificar si un objeto fue cambiado y solo ese sera modificado -->
    <article class="post-card">
        <h2>{{ dbz.name }}</h2>
        <h3>{{ dbz.ki }}</h3>
        <h4>{{ dbz.race }}</h4>
        <p> {{ dbz.description }} </p>
    </article>
} @empty {
    <p>Cargando</p>
}
